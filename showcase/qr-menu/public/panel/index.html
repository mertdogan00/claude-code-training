<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kahve Durağı · Panel</title>
  <link rel="stylesheet" href="/panel/style.css" />
</head>
<body>
  <section id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-form">
      <h1>Panel Girişi</h1>
      <input type="password" id="password" placeholder="Şifre" autocomplete="current-password" />
      <button type="submit">Giriş yap</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <section id="dashboard-view" class="dashboard" hidden>
    <header class="dashboard-header">
      <h1>Panel</h1>
      <button id="logout-btn" class="link-btn">Çıkış yap</button>
    </header>

    <section class="panel-block">
      <h2>Yeni kategori</h2>
      <form id="category-form" class="inline-form">
        <input type="text" id="category-name" placeholder="Kategori adı" required />
        <button type="submit">Ekle</button>
      </form>
    </section>

    <section class="panel-block">
      <h2>Yeni ürün</h2>
      <form id="product-form" class="product-form">
        <input type="text" id="product-name" placeholder="Ürün adı" required />
        <input type="text" id="product-description" placeholder="Açıklama" />
        <input type="number" id="product-price" placeholder="Fiyat" min="0.01" step="0.01" required />
        <select id="product-category"></select>
        <button type="submit">Ürün ekle</button>
        <p id="product-error" class="error" hidden></p>
      </form>
    </section>

    <section class="panel-block">
      <h2>Ürünler</h2>
      <div id="product-list" class="product-list"></div>
    </section>
  </section>

  <script src="/panel/app.js"></script>
</body>
</html>
