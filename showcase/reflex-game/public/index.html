<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refleks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="stat">
      <span class="label">Süre</span>
      <span id="timer" class="value">30</span>
    </div>
    <div class="stat">
      <span class="label">Skor</span>
      <span id="score" class="value">0</span>
    </div>
  </header>

  <main id="play-area" class="play-area">
    <button id="target" class="target" type="button" hidden aria-label="Hedef"></button>

    <section id="start-screen" class="overlay">
      <h1>Refleks</h1>
      <p>30 saniyede hedefleri yakala, en yüksek skoru topla.</p>
      <button id="start-btn" class="primary-btn" type="button">Başla</button>
    </section>

    <section id="end-screen" class="overlay" hidden>
      <h2>Süre Doldu!</h2>
      <p class="final-score">Skorun: <span id="final-score">0</span></p>

      <form id="name-form">
        <input id="player-name" type="text" maxlength="12" placeholder="İsmin (opsiyonel)" autocomplete="off">
        <button type="submit" class="primary-btn">Skoru Kaydet</button>
      </form>

      <section id="result-section" hidden>
        <h3>En İyi 5</h3>
        <ol id="leaderboard"></ol>
        <button id="play-again-btn" class="primary-btn" type="button">Tekrar Oyna</button>
      </section>
    </section>
  </main>

  <script src="/game.js"></script>
</body>
</html>
